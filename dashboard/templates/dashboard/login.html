<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AquaPlants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0 border-top border-success border-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="text-success">🌱 AquaPlants</h2>
                            <p class="text-muted">Acceso a Telemetría</p>
                        </div>

                        <!-- Formulario de Autenticación -->
                        <form method="POST">
                            <!-- Token de Ciberseguridad: Previene ataques CSRF -->
                            {% csrf_token %}
                            
                            <!-- Imprimimos los campos del formulario que genera Django automáticamente -->
                            {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label">{{ field.label }}</label>
                                <!-- Le damos clases de Bootstrap a los inputs -->
                                {{ field }}
                            </div>
                            {% endfor %}

                            <!-- Mensajes de error si se equivocan de clave -->
                            {% if form.errors %}
                            <div class="alert alert-danger p-2 small mt-3">
                                Usuario o contraseña incorrectos.
                            </div>
                            {% endif %}

                            <button type="submit" class="btn btn-success w-100 mt-3">Ingresar al Dashboard</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
