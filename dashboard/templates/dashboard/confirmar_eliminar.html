{% extends "dashboard/base.html" %}

{% block title %}Confirmar eliminación — AquaPlants{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 520px;">
    <div class="panel">
        <div class="panel-head">
            <h2 class="panel-title">Confirmar eliminación</h2>
        </div>
        <div class="panel-body">
            <p class="mb-2">
                Estás a punto de eliminar permanentemente: <strong>{{ elemento }}</strong>.
            </p>
            <p class="t-muted mb-4" style="font-size:0.83rem;">Esta acción no se puede deshacer.</p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-end gap-2 pt-3" style="border-top:1px solid var(--ap-border);">
                    <a href="{{ volver_url }}" class="btn btn-ghost">Cancelar</a>
                    <button type="submit" class="btn btn-danger-ap"><i class="bi bi-trash3"></i>Sí, eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
