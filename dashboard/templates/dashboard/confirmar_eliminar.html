{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Eliminación — AquaPlants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; }
        .card-custom { border: 1px solid #dc3545; background: #161b22; border-radius: 12px; }
    </style>
</head>
<body class="text-light">
    <div class="container py-5" style="max-width: 550px;">
        <div class="card card-custom shadow-lg">
            <div class="card-body p-4 text-center">
                <div class="display-5 mb-3 text-danger">⚠️</div>
                <h4 class="fw-bold mb-3 text-danger">¿Confirmar Eliminación?</h4>
                <p class="text-secondary mb-4">
                    Estás a punto de eliminar permanentemente: <strong class="text-light">{{ elemento }}</strong>.
                    <br><small class="text-warning">Esta acción no se puede deshacer.</small>
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{{ volver_url }}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-danger px-4 fw-bold">🗑️ Sí, Eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
